<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekrutacja | Los Santos Customs</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --accent-color: #eab308; /* Żółty LSC */
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background-color: var(--card-bg);
      padding: 25px 0;
      text-align: center;
      border-bottom: 3px solid var(--accent-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
    }

    header h1 span {
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
    }

    main {
      max-width: 850px;
      width: 90%;
      margin: 40px auto;
      background-color: var(--card-bg);
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(234, 179, 8, 0.2);
    }

    .info-box {
      margin-bottom: 30px;
      border-left: 4px solid var(--accent-color);
      padding-left: 15px;
    }

    .info-box h2 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .info-box p {
      color: var(--text-muted);
      line-height: 1.6;
    }

    .form-container {
      width: 100%;
      border: none;
      border-radius: 8px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 650px;
      border: none;
      background: transparent;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>LOS SANTOS <span>CUSTOMS</span></h1>
  </header>

  <main>
    <div class="info-box">
      <h2>Formularz Rekrutacyjny</h2>
      <p>Chcesz dołączyć do naszej ekipy mechaników w Los Santos? Wypełnij poniższy formularz. Wyniki rekrutacji pojawią się na naszym Discordzie.</p>
    </div>

    <div class="form-container">
      <!-- Wklej poniżej link do swojego Formularza Google lub Tally.so w cudzysłowie -->
      <iframe src="TUTAJ_WKLEJ_LINK_DO_FORMULARZA">Wczytywanie formularza...</iframe>
    </div>
  </main>

  <footer>
    &copy; 2026 Los Santos Customs · WaitRP
  </footer>

</body>
</html>
